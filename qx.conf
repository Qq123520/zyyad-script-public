# QuanX 远程配置 - 赵云与阿斗-小游戏（远程订阅）
# 说明：
# - 把本文件添加为 Quantumult X 的远程配置订阅（配置 -> 远程配置 -> 添加），即可自动加载下面的 rewrite 规则与 mitm。
# - 本脚本地址指向同仓库内的 zyyad.js（已按你的要求修改默认参数）。
# 默认脚本配置（已写入脚本文件 zyyad.js）：
# - 注册天数 RegisterDay = 30
# - 主动技能 ActiveSkill = [4, 21]  (神兵符, 垃圾桶)
# - 被动技能 PassiveSkill = [12,11,13,19,24,20] (农民, 降妖符, 招贤榜, 洛阳铲, 摸金校尉, 召唤陨石)
# 可通过 BoxJS 或客户端本地 prefs/persistentStore 覆盖以下 key：
# ddm.zyyad.registerday (number)
# ddm.zyyad.active (array or csv)
# ddm.zyyad.passive (array or csv)
# ddm.zyyad.gold (number)
# ddm.zyyad.level (number)
# ddm.zyyad.weaponmode (0/1/2)
# ddm.zyyad.weaponcount (number)
# ddm.zyyad.forcevalue (true/false)
# 示例：在 BoxJS 中把 ddm.zyyad.registerday 设为 15 则注册天数变为 15 天。

[rewrite_local]
^https?:\/\/.*\.mihuangame\.com\/api\/v\d+\/sys\/user\/data url script-request-body https://raw.githubusercontent.com/Qq123520/zyyad-script-public/main/zyyad.js
^https?:\/\/.*\.mihuangame\.com\/(api\/v\d+\/sys\/user|toutiaoGame\/ZhaoYunAndADou) url script-response-body https://raw.githubusercontent.com/Qq123520/zyyad-script-public/main/zyyad.js

[mitm]
hostname = *.mihuangame.com
